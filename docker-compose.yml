services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://dnd_planner:dnd_planner@db:5432/dnd_planner
      APP_TIMEZONE: Europe/Paris
      TZ: Europe/Paris
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dnd_planner
      POSTGRES_USER: dnd_planner
      POSTGRES_PASSWORD: dnd_planner
      TZ: Europe/Paris
      PGTZ: Europe/Paris
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dnd_planner -d dnd_planner"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

networks:
  default:
    name: scnet

volumes:
  postgres_data:
